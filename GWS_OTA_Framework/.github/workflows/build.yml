name: GWS OTA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Arduino CLI
      uses: arduino/setup-arduino-cli@v2

    - name: Instalar ESP8266
      run: |
        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
        arduino-cli core update-index
        arduino-cli core install esp8266:esp8266

    - name: Leer Proyecto
      run: |
        PROJECT=$(cat output/project.txt)
        echo "PROJECT=$PROJECT" >> $GITHUB_ENV

    - name: Mostrar Proyecto
      run: |
        echo Proyecto: $PROJECT

    - name: Instalar Librerias
      run: |
        while IFS= read -r LIB
        do
          if [ ! -z "$LIB" ]; then
            echo Instalando "$LIB"
            arduino-cli lib install "$LIB" || true
          fi
        done < projects/$PROJECT/libraries.txt

    - name: Compilar
      run: |

        mkdir build

        BOARD=$(cat projects/$PROJECT/board.txt)

        arduino-cli compile \
        --fqbn $BOARD \
        --output-dir build \
        projects/$PROJECT

    - name: Copiar BIN
      run: |
        cp build/*.bin output/firmware.bin

    - name: SHA256
      run: |
        sha256sum output/firmware.bin > output/firmware.sha256

    - name: Generar Version
      run: |
        python tools/update_version.py

    - name: Manifest
      run: |
        python tools/generate_manifest.py

    - name: Build Info
      run: |
        python tools/build_info.py

    - name: Commit
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: Nuevo firmware OTA

- name: Limpiar
  run: |
    python tools/clean_output.py

- name: Verificar Proyecto
  run: |
    python tools/check_project.py