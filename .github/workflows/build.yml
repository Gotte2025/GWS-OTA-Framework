name: GWS OTA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      ####################################################
      # CHECKOUT
      ####################################################

      - name: Checkout
        uses: actions/checkout@v4

      ####################################################
      # PYTHON
      ####################################################

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      ####################################################
      # ARDUINO CLI
      ####################################################

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      ####################################################
      # ESP8266 CORE
      ####################################################

      - name: Instalar ESP8266 Core
        run: |

          arduino-cli config init

          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

          arduino-cli core update-index

          arduino-cli core install esp8266:esp8266

      ####################################################
      # LIMPIAR
      ####################################################

      - name: Limpiar Output
        run: |
          python tools/clean_output.py

      ####################################################
      # VERIFICAR PROYECTO
      ####################################################

      - name: Verificar Proyecto
        run: |
          python tools/check_project.py

      ####################################################
      # LEER PROYECTO
      ####################################################

      - name: Leer Proyecto
        run: |

          echo "===== project.txt ====="

          cat output/project.txt

          PROJECT=$(cat output/project.txt)

          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      ####################################################
      # INFORMACION DEL REPOSITORIO
      ####################################################

      - name: Mostrar estructura
        run: |

          echo "===== PWD ====="
          pwd

          echo ""
          echo "===== ROOT ====="
          ls -la

          echo ""
          echo "===== PROJECTS ====="
          find projects

          echo ""
          echo "===== WeatherHouse ====="
          ls -la projects/$PROJECT

      ####################################################
      # BOARD
      ####################################################

      - name: Mostrar Board
        run: |

          echo "===== BOARD ====="

          cat projects/$PROJECT/board.txt

      ####################################################
      # LIBRERIAS
      ####################################################

      - name: Instalar Librerías
        run: |

          while IFS= read -r LIB
          do

            if [ ! -z "$LIB" ]; then

              echo "Instalando: $LIB"

              arduino-cli lib install "$LIB" || true

            fi

          done < projects/$PROJECT/libraries.txt

      ####################################################
      # COMPILAR
      ####################################################

      - name: Compilar Firmware
        run: |

          mkdir -p build

          BOARD=$(cat projects/$PROJECT/board.txt)

          echo "Compilando..."

          arduino-cli compile \
            --fqbn "$BOARD" \
            --output-dir build \
            "projects/$PROJECT"

      ####################################################
      # VER BINARIOS
      ####################################################

      - name: Buscar BIN
        run: |

          echo "===== BUILD ====="

          find build

      ####################################################
      # COPIAR
      ####################################################

      - name: Copiar Firmware
        run: |

          BIN=$(find build -name "*.bin" | head -n 1)

          echo "Firmware encontrado:"

          echo "$BIN"

          cp "$BIN" output/firmware.bin

      ####################################################
      # HASH
      ####################################################

      - name: SHA256
        run: |

          sha256sum output/firmware.bin > output/firmware.sha256

      ####################################################
      # VERSION
      ####################################################

      - name: Actualizar Version
        run: |
          python tools/update_version.py

      ####################################################
      # MANIFEST
      ####################################################

      - name: Manifest
        run: |
          python tools/generate_manifest.py

      ####################################################
      # BUILD INFO
      ####################################################

      - name: Build Info
        run: |
          python tools/build_info.py

      ####################################################
      # ARTEFACTO
      ####################################################

      - name: Publicar Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: output/firmware.bin

      ####################################################
      # COMMIT
      ####################################################

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Nuevo firmware OTA"