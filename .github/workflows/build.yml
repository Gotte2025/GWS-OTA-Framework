name: GWS OTA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================
      # Descargar repositorio
      # ==========================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================
      # Python
      # ==========================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================
      # Arduino CLI
      # ==========================
      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # ==========================
      # ESP8266 Core
      # ==========================
      - name: Instalar ESP8266 Core
        run: |
          arduino-cli config init

          arduino-cli config add board_manager.additional_urls \
          https://arduino.esp8266.com/stable/package_esp8266com_index.json

          arduino-cli core update-index

          arduino-cli core install esp8266:esp8266

      # ==========================
      # Limpiar
      # ==========================
      - name: Limpiar Output
        run: |
          python tools/clean_output.py

      # ==========================
      # Verificar proyecto
      # ==========================
      - name: Verificar Proyecto
        run: |
          python tools/check_project.py

      # ==========================
      # Leer proyecto
      # ==========================
      - name: Leer Proyecto
        run: |
          PROJECT=$(cat output/project.txt)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Mostrar Proyecto
        run: |
          echo "Proyecto seleccionado: $PROJECT"

      # ==========================
      # Instalar librerías
      # ==========================
      - name: Instalar Librerías
        run: |
          while IFS= read -r LIB
          do
            if [ ! -z "$LIB" ]; then
              echo "Instalando $LIB"
              arduino-cli lib install "$LIB" || true
            fi
          done < projects/$PROJECT/libraries.txt

      # ==========================
      # Compilar
      # ==========================
      - name: Compilar Firmware
        run: |

          mkdir -p build

          BOARD=$(cat projects/$PROJECT/board.txt)

          echo "Board: $BOARD"

          arduino-cli compile \
            --fqbn $BOARD \
            --output-dir build \
            projects/$PROJECT

      # ==========================
      # Buscar firmware
      # ==========================
      - name: Buscar BIN
        run: |
          find build -name "*.bin"

      # ==========================
      # Copiar firmware
      # ==========================
      - name: Copiar Firmware
        run: |
          cp $(find build -name "*.bin" | head -n1) output/firmware.bin

      # ==========================
      # SHA256
      # ==========================
      - name: SHA256
        run: |
          sha256sum output/firmware.bin > output/firmware.sha256

      # ==========================
      # Version
      # ==========================
      - name: Actualizar Versión
        run: |
          python tools/update_version.py

      # ==========================
      # Manifest
      # ==========================
      - name: Generar Manifest
        run: |
          python tools/generate_manifest.py

      # ==========================
      # Build Info
      # ==========================
      - name: Build Info
        run: |
          python tools/build_info.py

      # ==========================
      # Publicar firmware
      # ==========================
      - name: Subir Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: output/firmware.bin

      # ==========================
      # Commit automático
      # ==========================
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Nuevo firmware OTA"
